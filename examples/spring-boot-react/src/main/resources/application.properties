# In development, pages are rendered by the Vite dev server (/__inertia_ssr) while vite.hot exists.
# In production, run the SSR bundle with `npm run ssr`; Inertia4J posts pages to http://127.0.0.1:13714 (inertia.ssr.url).
# When the SSR server is unreachable, pages fall back to client-side rendering.
inertia.ssr.enabled=true
