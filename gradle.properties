# Release versions come from the git tag (v3.x.y) through -Pversion in the release workflow.
# The major version follows the Inertia.js protocol version.
version=3.0.0-SNAPSHOT

# Kotlin is compiled in the Gradle process for CodeQL, which the default 512 MiB heap can't hold.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
