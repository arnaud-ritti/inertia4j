version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: [ "*" ]

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      gradle-minor-and-patch:
        update-types: [ "minor", "patch" ]

  - package-ecosystem: npm
    directory: /examples/spring-boot-react
    schedule:
      interval: monthly
    groups:
      example-dependencies:
        patterns: [ "*" ]
