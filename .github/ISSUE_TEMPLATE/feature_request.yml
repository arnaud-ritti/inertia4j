name: Feature request
description: Suggest a new feature or an improvement
labels: [ "enhancement" ]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/Inertia4J/inertia4j/blob/main/docs/roadmap.md) and [existing issues](https://github.com/Inertia4J/inertia4j/issues) before opening a new request.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Link the relevant part of the Inertia.js protocol if applicable.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like Inertia4J to solve it? API sketches are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you have looked at.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would like to implement this feature myself.
