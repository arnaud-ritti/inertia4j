name: Documentation improvement
description: Report missing, unclear or outdated documentation
labels: [ "documentation" ]
body:
  - type: input
    id: location
    attributes:
      label: Location
      description: Link to the page or file concerned, if any.
      placeholder: "docs/advanced.md"

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is missing or unclear, and what should the documentation say instead?
    validations:
      required: true
