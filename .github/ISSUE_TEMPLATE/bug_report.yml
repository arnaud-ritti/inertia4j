name: Bug report
description: Report something that does not work as expected
labels: [ "bug" ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search [existing issues](https://github.com/Inertia4J/inertia4j/issues?q=is%3Aissue) first.

  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Which Inertia4J module is affected?
      multiple: true
      options:
        - inertia4j-core
        - inertia4j-spi
        - inertia4j-spring-boot-3
        - inertia4j-spring-boot-4
        - inertia4j-ktor
        - inertia4j-typescript (type generation)
        - inertia4j-typescript-gradle-plugin
        - Not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: A minimal controller, route or repository that reproduces the problem helps a lot.
      placeholder: |
        1. Define a controller returning `inertia.render("Users/Index", props)`
        2. Request `/users` with the `X-Inertia` header
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and stack traces
      description: Paste relevant output. It is formatted as code automatically.
      render: text

  - type: input
    id: inertia4j-version
    attributes:
      label: Inertia4J version
      placeholder: "2.0.0"
    validations:
      required: true

  - type: input
    id: framework-version
    attributes:
      label: Framework version
      placeholder: "Spring Boot 3.3.12 / Ktor 3.0.0"
    validations:
      required: true

  - type: input
    id: jdk-version
    attributes:
      label: JDK version
      placeholder: "Temurin 21.0.6"

  - type: input
    id: client-version
    attributes:
      label: Inertia.js client adapter and version
      placeholder: "@inertiajs/react 3.7.1"

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Build tool, OS, anything else that might help.
